name: Regressao Completa — OmniQA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  #  API + Web + Performance
  #  Mobile: executado localmente (requer dispositivo/emulador)
  # ─────────────────────────────────────────
  api-web-performance:
    name: API / Web / Performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar browsers Playwright
        run: npx playwright install chromium --with-deps

      - name: Instalar k6
        run: |
          curl https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz -L | tar xvz --strip-components 1
          sudo mv k6 /usr/local/bin/

      - name: Testes de API
        run: npm run test:api

      - name: Testes Web
        run: npm run test:web

      - name: Testes de Performance
        run: npm run test:performance

      - name: Gerar relatorios
        if: always()
        run: npm run report:all

      - name: Upload relatorio JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-junit
          path: reports/junit/
          retention-days: 30

      - name: Upload relatorio Performance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-performance
          path: reports/performance/
          retention-days: 30

      - name: Upload relatorio Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-playwright
          path: reports/playwright-report/
          retention-days: 30

      - name: Publicar resultado JUnit no GitHub
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: reports/junit/*.xml
          check_name: Resultados dos Testes
