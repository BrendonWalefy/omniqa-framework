name: Regressão Completa — OmniQA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ─────────────────────────────────────────
  #  API + Web
  #  Performance: workflow agendado (performance.yml)
  #  Mobile: executado localmente (requer dispositivo/emulador)
  # ─────────────────────────────────────────
  api-web:
    name: API / Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar browsers Playwright
        run: npx playwright install chromium --with-deps

      - name: Testes de API
        run: npm run test:api

      - name: Testes Web
        run: npm run test:web

      - name: Gerar relatórios
        if: always()
        run: npm run report:junit

      - name: Upload relatório JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatório-junit
          path: reports/junit/
          retention-days: 30

      - name: Upload relatório Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatório-playwright
          path: reports/playwright-report/
          retention-days: 30

      - name: Publicar resultado JUnit no GitHub
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: reports/junit/*.xml
          check_name: Resultados dos Testes
