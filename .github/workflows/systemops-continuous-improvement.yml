name: SystemOps — Melhoria Contínua

# Roda diariamente contra produção (app.systemops.com.br) somente com smoke
# read-only e regressão visual. Replay conversacional é deliberadamente excluído:
# ele exige dataset aprovado e ambiente não produtivo.
#
# Secrets necessários no repositório GitHub:
#   SYSTEMOPS_BASE_URL             — https://app.systemops.com.br
#   SYSTEMOPS_E2E_SECRET           — mesmo valor de E2E_SECRET no sales-engine
#   SYSTEMOPS_ADMIN_EMAIL / SYSTEMOPS_ADMIN_PASSWORD — login web de teste
#   SYSTEMOPS_SIMULATE_API_KEY     — chave do endpoint /api/playbook/simulate
#
# Nunca habilitar SYSTEMOPS_RUN_DESTRUCTIVE ou replay neste workflow.

on:
  schedule:
    - cron: '0 9 * * *' # 09:00 UTC = 06:00 BRT, diariamente
  workflow_dispatch:

jobs:
  continuous-improvement:
    name: Smoke + Visual (produção, read-only)
    runs-on: ubuntu-latest
    env:
      SYSTEMOPS_BASE_URL: ${{ secrets.SYSTEMOPS_BASE_URL }}
      SYSTEMOPS_E2E_SECRET: ${{ secrets.SYSTEMOPS_E2E_SECRET }}
      SYSTEMOPS_ADMIN_EMAIL: ${{ secrets.SYSTEMOPS_ADMIN_EMAIL }}
      SYSTEMOPS_ADMIN_PASSWORD: ${{ secrets.SYSTEMOPS_ADMIN_PASSWORD }}
      SYSTEMOPS_SIMULATE_API_KEY: ${{ secrets.SYSTEMOPS_SIMULATE_API_KEY }}
      SYSTEMOPS_RUN_PRODUCTION_SMOKE: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar browsers Playwright
        run: npx playwright install chromium --with-deps

      - name: Smoke (API + Web, read-mostly)
        run: npm run test:systemops:smoke

      - name: Regressão visual
        run: npm run test:systemops:visual

      - name: Gerar relatórios
        if: always()
        run: npm run report:junit

      - name: Upload relatório JUnit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-junit
          path: reports/junit/
          retention-days: 30

      - name: Upload relatório Playwright
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-playwright
          path: reports/playwright-report/
          retention-days: 30

      - name: Publicar resultado JUnit no GitHub
        uses: mikepenz/action-junit-report@v4
        if: always()
        with:
          report_paths: reports/junit/*.xml
          check_name: SystemOps — Melhoria Contínua
